# Prebuilt baresip native libraries (the contents of distribution/).
#
# GitHub's "Native libraries" workflow builds them with libbaresip-android and
# publishes distribution.zip as the release "native-libs-<version>".
# The Android Studio build downloads that zip into distribution/ when it's
# missing or out of date (gradle/native-libs.gradle.kts).
#
# Bump `version` (and push) whenever the libbaresip-android submodule or
# ndkVersion in app/build.gradle.kts changes. The push starts the workflow.
version=94.1.5-1
